# =============================================================================
# workflow-intel — source universe   (ratified curated set)
# =============================================================================
# The vetted, high-signal source list: official vendor/model blogs, release
# notes, and a few curated newsletters/publications, plus the email newsletters
# ingested via IMAP. The two arXiv firehoses from the Slice 0 stub were dropped
# (too noisy — a single ingest pulled ~1,512 items). URLs verified early
# June 2026.
#
# Rules:
#   - Each ENABLED rss/atom source must have a real, verified feed URL (validated
#     at load). Aspirational / unverified ones stay `enabled: false` with a TODO
#     until confirmed. We do NOT guess feed URLs.
#   - Each ENABLED email source (Slice 1.5) carries an IMAP folder path in `url`
#     instead of an HTTP URL — the folder IS the source. A dedicated Gmail is
#     subscribed to the newsletter and the message is labeled into that folder;
#     the weekly poller selects the folder read-only. The exact folder strings
#     are confirmed at the live smoke (1.5d).
#
# Schema (validated by src/ingest/sources.ts):
#   version: integer
#   sources: list of { slug, name, url, kind, category, source_tier, enabled }
#   kind: rss | atom | email
#   source_tier: 0–3 BASELINE source credibility (3 = lab/primary/first-party,
#     2 = curated practitioner/publication/newsletter, 1 = solo thread,
#     0 = SEO farm). Baseline ONLY — not the value any gate reads. Slice 3 triage
#     seeds each item's per-item `source_credibility` from this baseline and may
#     downgrade it with a cited reason (never silently, never upgrade past it
#     without cause); the DISCARD gate reads that per-item score, not this tier.
#     The two terms are distinct and must not be used interchangeably. Default 2.
#     This set is first-party=3 / curated-third-party=2 — nothing sits at 0–1, so
#     the gate's lower tiers are reachable only by a cited per-item downgrade.
# =============================================================================
version: 1

sources:
  - slug: openai-news
    name: "OpenAI — News"
    url: https://openai.com/news/rss.xml
    kind: rss
    category: vendor_blog
    source_tier: 3   # first-party lab
    enabled: true

  - slug: google-ai-blog
    name: "Google — The Keyword (AI)"
    url: https://blog.google/technology/ai/rss/
    kind: rss
    category: vendor_blog
    source_tier: 3   # first-party lab
    enabled: true

  - slug: huggingface-blog
    name: "Hugging Face — Blog"
    url: https://huggingface.co/blog/feed.xml
    kind: atom
    category: vendor_blog
    source_tier: 3   # first-party platform/lab
    enabled: true

  - slug: claude-code-releases
    name: "Claude Code — Releases"
    url: https://github.com/anthropics/claude-code/releases.atom
    kind: atom
    category: release_notes
    source_tier: 3   # first-party primary release notes
    enabled: true

  - slug: ahead-of-ai
    name: "Ahead of AI (Sebastian Raschka)"
    url: https://magazine.sebastianraschka.com/feed
    kind: rss
    category: newsletter
    source_tier: 2   # curated practitioner newsletter
    enabled: true

  - slug: the-gradient
    name: "The Gradient"
    url: https://thegradient.pub/rss/
    kind: rss
    category: publication
    source_tier: 2   # curated publication
    enabled: true

  - slug: last-week-in-ai
    name: "Last Week in AI"
    url: https://lastweekin.ai/feed
    kind: rss
    category: newsletter
    source_tier: 2   # curated roundup newsletter
    enabled: true

  - slug: simon-willison
    name: "Simon Willison's Weblog (LLM / AI engineering)"
    url: "https://simonwillison.net/atom/everything/"
    kind: atom
    category: eng_blog
    source_tier: 2   # curated practitioner/eng blog
    enabled: true

  # --- Email newsletters (Slice 1.5) ---------------------------------------
  # No public RSS/Atom; ingested via IMAP from a dedicated Gmail. `url` is the
  # Gmail-label / IMAP-folder path, not an HTTP URL. Folder strings are confirmed
  # at the live smoke — adjust there if Gmail exposes them differently.
  - slug: anthropic
    name: "Anthropic (newsletter)"
    # Collapses the previously-parked Anthropic news/engineering entries into one
    # Gmail label (a single subscription inbox), matching how the label is set up.
    url: "workflow-intel/Anthropic"
    kind: email
    category: vendor_blog
    source_tier: 3   # first-party lab
    enabled: true

  - slug: import-ai
    name: "Import AI (Jack Clark)"
    url: "workflow-intel/Import AI"
    kind: email
    category: newsletter
    source_tier: 2   # curated practitioner newsletter
    enabled: true

  - slug: the-batch
    name: "The Batch (DeepLearning.AI)"
    url: "workflow-intel/The Batch"
    kind: email
    category: newsletter
    source_tier: 2   # curated newsletter
    enabled: true
